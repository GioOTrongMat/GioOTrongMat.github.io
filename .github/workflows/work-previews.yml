name: Build work previews
on:
  push:
    branches: [main]
    paths: [content/site.json]
  workflow_dispatch:
concurrency:
  group: work-previews
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --disable-pip-version-check gdown
          gdown --version
          ffmpeg -version | head -n 1
      - name: Build portrait previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .previews
          node <<'NODE' |
          const data = require("./content/site.json");
          for (const work of data.works.items || []) {
            if (!work.id || !work.fullVideo) continue;
            let driveId = "";
            try {
              const url = new URL(work.fullVideo);
              if (url.protocol === "https:" && url.hostname === "drive.google.com") {
                driveId = url.pathname.match(/^\/file\/d\/([A-Za-z0-9_-]+)(?:\/|$)/)?.[1]
                  || (url.pathname === "/open" ? url.searchParams.get("id") : "")
                  || "";
              }
            } catch {}
            if (!/^[A-Za-z0-9_-]{10,}$/.test(driveId)) {
              console.error(`Cannot parse Google Drive file ID for work: ${work.id}`);
              process.exitCode = 1;
              continue;
            }
            console.log([work.id, driveId].join("\t"));
          }
          NODE
          while IFS=$'\t' read -r id drive_id; do
            [[ "$id" =~ ^[a-z0-9][a-z0-9-]{2,80}$ ]] || { echo "Invalid work id: $id"; exit 1; }
            echo "Processing work: $id"
            echo "Drive file id parsed successfully"
            echo "Downloading source..."
            gdown "$drive_id" -O ".previews/$id-source"
            echo "Generating preview..."
            if ffprobe -v error -select_streams a:0 -show_entries stream=index -of csv=p=0 ".previews/$id-source" | grep -q .; then
              ffmpeg -y -i ".previews/$id-source" -t 13 -filter_complex "[0:v]scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,setsar=1,fade=t=out:st=10:d=3[v];[0:a]afade=t=out:st=10:d=3[a]" -map "[v]" -map "[a]" -c:v libx264 -preset medium -crf 22 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart ".previews/$id.mp4" < /dev/null
            else
              ffmpeg -y -i ".previews/$id-source" -t 13 -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,setsar=1,fade=t=out:st=10:d=3" -an -c:v libx264 -preset medium -crf 22 -pix_fmt yuv420p -movflags +faststart ".previews/$id.mp4" < /dev/null
            fi
            rm -f ".previews/$id-source"
          done
      - name: Upload previews to private R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          echo "Uploading preview..."
          aws s3 sync .previews/ s3://gio-portfolio-work-previews/works/ --exclude "*-source" --content-type video/mp4 --cache-control "public,max-age=3600" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
